name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
      - gh-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/gh-pages' || github.ref == 'refs/heads/gh-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run test --if-present
        working-directory: source
      - name: Set version from Git tag
        run: |
          version_tag="$(git -C source tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)"
          echo "VITE_VERSION_TAG=${version_tag:-development}" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: source
      - name: Prepare site branch
        run: |
          if git -C site ls-remote --exit-code origin refs/heads/pages-site >/dev/null 2>&1; then
            git -C site fetch origin pages-site
            git -C site checkout -B pages-site FETCH_HEAD
          else
            git -C site checkout --orphan pages-site
            git -C site rm -rf . || true
            git -C site clean -fdx
          fi
      - name: Update deployed site
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/gh-pages" ]]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf -- {} +
            cp -a ../source/dist/. .
          elif [[ "$GITHUB_REF" == "refs/heads/gh-preview" ]]; then
            rm -rf preview
            mkdir -p preview
            cp -a ../source/dist/. preview/
          else
            echo "Deployment must run from gh-pages or gh-preview." >&2
            exit 1
          fi
        working-directory: site
      - name: Publish site artifact
        run: |
          git -C site add --all
          if ! git -C site diff --cached --quiet; then
            git -C site config user.name "github-actions[bot]"
            git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C site commit -m "Update deployed site from ${GITHUB_REF_NAME}"
            git -C site push origin HEAD:pages-site
          fi
          mkdir -p site-artifact
          git -C site archive HEAD | tar -x -C site-artifact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
