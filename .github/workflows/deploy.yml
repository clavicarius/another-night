name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
      - release-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: release-preview
          path: preview-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            preview-source/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm ci
        working-directory: preview-source
      - run: npm run test --if-present
        working-directory: site
      - run: npm run test --if-present
        working-directory: preview-source
      - name: Set site version from Git tag
        run: |
          version_tag="$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)"
          echo "VITE_VERSION_TAG=${version_tag:-development}" >> "$GITHUB_ENV"
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Set preview version from Git tag
        run: |
          version_tag="$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)"
          echo "VITE_VERSION_TAG=${version_tag:-development}" >> "$GITHUB_ENV"
        working-directory: preview-source
      - run: npm run build
        working-directory: preview-source
      - name: Add preview to Pages artifact
        run: |
          mkdir -p site/dist/preview
          cp -a preview-source/dist/. site/dist/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
