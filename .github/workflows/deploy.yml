name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
      - gh-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: gh-preview
          path: preview-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            preview-source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run test --if-present
        working-directory: source
      - run: npm ci
        working-directory: preview-source
      - run: npm run test --if-present
        working-directory: preview-source
      - name: Set site version from Git tag
        run: |
          version_tag="$(git -C source tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)"
          echo "VITE_VERSION_TAG=${version_tag:-development}" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: source
      - name: Set preview version from Git tag
        run: |
          version_tag="$(git -C preview-source tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)"
          echo "VITE_VERSION_TAG=${version_tag:-development}" >> "$GITHUB_ENV"
      - run: npm run build
        working-directory: preview-source
      - name: Assemble Pages artifact
        run: |
          mkdir -p source/dist/preview
          cp -a preview-source/dist/. source/dist/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
